<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Jeong on a phone</title>
		<link rel="icon" href="dist/icon.svg" type="image/svg+xml" />
		<style>
			/* Jeong at an iPhone's size, with Obsidian's floating toolbar drawn in (the frame passes ?phone) */
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 12px; background: #111; font: 13px system-ui, sans-serif; color: #999; }
			iframe { width: 390px; height: 844px; border: 0; border-radius: 44px; box-shadow: 0 0 0 10px #000, 0 30px 80px rgba(0, 0, 0, 0.6); }
		</style>
	</head>
	<body>
		<iframe id="phone" title="Jeong on a phone"></iframe>
		<div>390 × 844 · add ?real to this page's address to open your vault instead of the sample journal</div>
		<script>
			const real = new URLSearchParams(location.search).has('real');
			document.getElementById('phone').src = `index.html?phone${real ? '' : '&demo'}`;
		</script>
	</body>
</html>
