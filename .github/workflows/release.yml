name: Release plugin

# Push a tag that matches the version in plugin/manifest.json (for example 0.1.0)
# to build the plugin and publish main.js, manifest.json, and styles.css as a GitHub release.
# BRAT installs and updates Jeong on phones from these releases.

on:
    push:
        tags: ['*']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: plugin
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: 'npm'
                  cache-dependency-path: plugin/package-lock.json
            - run: npm ci
            - run: npm run build
            - name: Check the tag matches the manifest version
              run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "${GITHUB_REF_NAME}" build/main.js build/manifest.json build/styles.css --title "Jeong ${GITHUB_REF_NAME}" --notes "Install on a phone with BRAT: add violet-kester/jeong."
